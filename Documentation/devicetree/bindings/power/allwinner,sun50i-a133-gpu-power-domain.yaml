%YAML 1.2
---
$id: http://devicetree.org/schemas/power/allwinner,sun50i-a133-gpu-power-domain.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A133 GPU power domain

maintainers:
  - Jack Kingston <998656+jkingston@users.noreply.github.com>

properties:
  compatible:
    const: allwinner,sun50i-a133-gpu-power-domain
  reg:
    maxItems: 1
  clocks:
    items:
      - description: GPU core clock
      - description: GPU bus clock
      - description: PPU bus clock
  clock-names:
    items:
      - const: core
      - const: bus
      - const: ppu
  resets:
    items:
      - description: GPU reset
      - description: PPU reset
  reset-names:
    items:
      - const: gpu
      - const: ppu
  '#power-domain-cells':
    const: 0

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - resets
  - reset-names
  - '#power-domain-cells'

additionalProperties: false
