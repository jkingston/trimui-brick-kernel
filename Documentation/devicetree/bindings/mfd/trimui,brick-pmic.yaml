%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/trimui,brick-pmic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TrimUI Brick boot-established PMIC

maintainers:
  - Jack Kingston <998656+jkingston@users.noreply.github.com>

description: |
  Panel supply interface at I2C address 0x34. CLDO1 is a shared,
  boot-enabled 1.8 V rail; CLDO4 supplies the panel at 3.3 V.
  The interface preserves inherited voltage selectors and shared CLDO1.
  Read-only battery voltage, initialized gauge capacity and USB input
  presence are provided by a child device. The interrupt controller routes
  power-key press and release events without changing key timing. Charging
  remains boot-established.

properties:
  compatible:
    const: trimui,brick-pmic
  interrupts:
    maxItems: 1
  reg:
    maxItems: 1
  regulators:
    type: object
    additionalProperties: false
    properties:
      cldo1:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
        required:
          - regulator-always-on
      cldo4:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
    required:
      - cldo1
      - cldo4

required:
  - compatible
  - reg
  - interrupts
  - regulators

additionalProperties: false
