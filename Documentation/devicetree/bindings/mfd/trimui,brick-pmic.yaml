%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/trimui,brick-pmic.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TrimUI Brick boot-established PMIC

maintainers:
  - Jack Kingston <998656+jkingston@users.noreply.github.com>

description: |
  Panel supply interface at I2C address 0x34. CLDO1 is a shared,
  boot-enabled 1.8 V rail; CLDO4 supplies the panel at 3.3 V. ALDO4 is
  boot-enabled at 1.8 V for audio; ALDO3 and BLDO1 are 3.3 V radio rails.
  The interface preserves inherited voltage selectors and shared CLDO1.
  Read-only battery voltage, initialized gauge capacity and USB input
  presence are provided by a child device. The interrupt controller routes
  power-key press and release events without changing key timing. Power-key
  press can wake suspend-to-idle through the nested PMIC interrupt and its
  R_INTC NMI parent. This does not establish deep-suspend support. Charging
  current limits remain boot-established unless explicitly written through
  power-supply properties. The Brick policy caps charge current at 1920 mA
  (stock's encoded 1950 mA setting) and USB input at 2500 mA. These are
  configuration limits, not measured current or negotiated source capability.
  Voltage, gauge and suspend charging configuration are not changed.
  Optional VMID and drivevbus regulators expose
  the independent boost and output switch on nonzero-selector AXP2202 parts.
  The output switch has an explicit vin-supply parent reference to VMID;
  each provider has a 1000 microsecond enable delay.

properties:
  compatible:
    const: trimui,brick-pmic
  interrupts:
    maxItems: 1
  reg:
    maxItems: 1
  regulators:
    type: object
    additionalProperties: false
    properties:
      aldo3:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
        required:
          - regulator-always-on
      aldo4:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
        required:
          - regulator-always-on
      bldo1:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
        required:
          - regulator-always-on
      cldo1:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
        required:
          - regulator-always-on
      vmid:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
      drivevbus:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        properties:
          vin-supply:
            description: Parent VMID boost regulator
        required:
          - vin-supply
        unevaluatedProperties: false
      cldo3:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
        required:
          - regulator-always-on
      cldo4:
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
    dependencies:
      vmid: [drivevbus]
      drivevbus: [vmid]
    required:
      - aldo3
      - aldo4
      - bldo1
      - cldo1
      - cldo4

required:
  - compatible
  - reg
  - interrupts
  - regulators

additionalProperties: false
