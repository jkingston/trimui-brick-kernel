%YAML 1.2
---
$id: http://devicetree.org/schemas/media/allwinner,sun50i-h6-vpu-g2.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Hantro G2 VPU codec implemented on Allwinner SoCs

maintainers:
  - Jernej Skrabec <jernej.skrabec@gmail.com>

description:
  Hantro G2 video decode accelerator present on Allwinner H6 and A133 SoCs.

properties:
  compatible:
    enum:
      - allwinner,sun50i-a133-vpu-g2
      - allwinner,sun50i-h6-vpu-g2

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    minItems: 2
    maxItems: 3

  clock-names:
    minItems: 2
    maxItems: 3

  resets:
    maxItems: 1

  allwinner,video-engine-domain:
    $ref: /schemas/types.yaml#/definitions/phandle
    description: Shared clock and reset domain on A133

  iommus:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts

allOf:
  - if:
      properties:
        compatible:
          const: allwinner,sun50i-a133-vpu-g2
    then:
      properties:
        clocks: false
        clock-names: false
        resets: false
        iommus: false
      required:
        - allwinner,video-engine-domain
    else:
      properties:
        clocks:
          items:
            - description: Bus Clock
            - description: Module Clock
        clock-names:
          items:
            - const: bus
            - const: mod
      required:
        - iommus
        - clocks
        - clock-names
        - resets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/clock/sun50i-h6-ccu.h>
    #include <dt-bindings/reset/sun50i-h6-ccu.h>

    video-codec-g2@1c00000 {
        compatible = "allwinner,sun50i-h6-vpu-g2";
        reg = <0x01c00000 0x1000>;
        interrupts = <GIC_SPI 90 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&ccu CLK_BUS_VP9>, <&ccu CLK_VP9>;
        clock-names = "bus", "mod";
        resets = <&ccu RST_BUS_VP9>;
        iommus = <&iommu 5>;
    };

...
