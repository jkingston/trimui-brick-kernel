%YAML 1.2
---
$id: http://devicetree.org/schemas/gpu/allwinner,sun50i-a133-gpu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A133 PowerVR GE8300 GPU

maintainers:
  - Jack Kingston <998656+jkingston@users.noreply.github.com>

properties:
  compatible:
    items:
      - const: allwinner,sun50i-a133-gpu
      - const: img,gpu
  reg:
    maxItems: 1
  interrupts:
    maxItems: 1
  interrupt-names:
    const: IRQGPU
  clocks:
    items:
      - description: GPU core clock
      - description: GPU bus clock
      - description: PPU bus clock
  clock-names:
    items:
      - const: core
      - const: bus
      - const: ppu
  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - power-domains

additionalProperties: false
