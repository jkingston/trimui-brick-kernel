%YAML 1.2
---
$id: http://devicetree.org/schemas/phy/allwinner,sun50i-a133-dphy.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner A133 MIPI D-PHY controller

maintainers:
  - Jack Kingston <998656+jkingston@users.noreply.github.com>

properties:
  compatible:
    const: allwinner,sun50i-a133-dphy
  reg:
    items:
      - description: D-PHY registers
      - description: SoC revision register
  reg-names:
    items:
      - const: phy
      - const: soc-revision
  clocks:
    items:
      - description: Bus clock
      - description: Module clock
  clock-names:
    items:
      - const: bus
      - const: mod
  resets:
    maxItems: 1
  '#phy-cells':
    const: 0

required:
  - compatible
  - reg
  - reg-names
  - clocks
  - clock-names
  - resets
  - '#phy-cells'

additionalProperties: false
