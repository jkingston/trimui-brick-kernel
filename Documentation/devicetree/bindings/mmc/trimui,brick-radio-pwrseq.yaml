%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/trimui,brick-radio-pwrseq.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TrimUI Brick shared-clock WLAN power sequence

maintainers:
  - Jack Kingston <998656+jkingston@users.noreply.github.com>

description: |
  Holds both shared radio clocks before releasing WLAN reset. Reset is held
  on clock acquisition failure. Reset release is followed by a 100 ms delay.

properties:
  compatible:
    const: trimui,brick-radio-pwrseq
  clocks:
    items:
      - description: Shared low-power reference clock
      - description: Shared high-frequency reference clock
  clock-names:
    items:
      - const: lpo
      - const: ref
  reset-gpios:
    maxItems: 1
    description: Active-low WLAN reset

required:
  - compatible
  - clocks
  - clock-names
  - reset-gpios

additionalProperties: false
