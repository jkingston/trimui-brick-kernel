%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/trimui,brick-jd9168.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: TrimUI Brick JD9168 DSI panel

maintainers:
  - Jack Kingston <998656+jkingston@users.noreply.github.com>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: trimui,brick-jd9168
  reg:
    maxItems: 1
  dsi-lanes:
    $ref: /schemas/types.yaml#/definitions/uint32
    const: 4
  reset-gpios:
    maxItems: 1
  backlight: true
  power0-supply:
    description: Shared 1.8 V CLDO1 supply
  power1-supply:
    description: 3.3 V CLDO4 supply
  pinctrl-names:
    items:
      - const: active
      - const: sleep
  pinctrl-0: true
  pinctrl-1: true
  display-timings:
    $ref: /schemas/display/panel/display-timings.yaml#

required:
  - compatible
  - reg
  - dsi-lanes
  - reset-gpios
  - backlight
  - power0-supply
  - power1-supply
  - pinctrl-names
  - pinctrl-0
  - pinctrl-1
  - display-timings

unevaluatedProperties: false
